name: Verify & Deploy khaleb-predict

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript syntax & run unit assertions
        run: |
          for f in assets/*.js; do
            node --check "$f"
          done
          node assets/verify-bankroll.js
          node assets/audit-projet.js

      - name: Check for accidental privileged key exposure in client files
        run: |
          if grep -rnE "service_role" assets/ index.html 2>/dev/null; then
            echo "ERREUR : référence clé privilégiée détectée côté client."
            exit 1
          fi

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
